<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pulp Pro | AI Trainer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <style>
        :root { --bg: #000; --accent: #f9d71c; --glass: rgba(255, 255, 255, 0.1); }
        body { background: var(--bg); color: #fff; font-family: -apple-system, system-ui; margin: 0; overflow: hidden; }
        #video-container { position: relative; width: 100vw; height: 55vh; background: #111; }
        #webcam { width: 100%; height: 100%; object-fit: cover; }
        .controls { height: 45vh; padding: 15px; background: #0a0a0a; border-top: 1px solid var(--glass); display: flex; flex-direction: column; }
        .mode-toggle { display: flex; background: var(--glass); border-radius: 12px; margin-bottom: 10px; padding: 4px; }
        .mode-btn { flex: 1; padding: 12px; text-align: center; font-weight: bold; border-radius: 10px; transition: 0.3s; cursor: pointer; }
        .active-mode { background: var(--accent); color: #000; }
        #train-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .stage-btn { background: #1a1a1a; border: 1px solid var(--glass); border-radius: 8px; color: #fff; font-size: 14px; padding: 15px 5px; font-weight: bold; }
        .stage-btn:active { background: var(--accent); color: #000; }
        .count-badge { display: block; font-size: 10px; opacity: 0.5; margin-top: 4px; }
        #test-view { display: none; text-align: center; flex-grow: 1; justify-content: center; align-items: center; flex-direction: column; border: 2px dashed var(--glass); border-radius: 15px; }
        #prediction-text { font-size: 38px; font-weight: 900; color: var(--accent); margin: 0; }
        .action-bar { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 15px; border-radius: 12px; border: none; font-weight: bold; font-size: 14px; }
        .btn-sync { background: #fff; color: #000; }
        .btn-purge { background: #331111; color: #ff4444; }
        #status-msg { font-size: 10px; text-align: center; margin-bottom: 5px; color: #888; }
    </style>
</head>
<body>

    <div id="video-container">
        <video autoplay playsinline muted id="webcam"></video>
    </div>

    <div class="controls">
        <div id="status-msg">Initializing AI Engine...</div>
        <div class="mode-toggle">
            <div id="btn-train" class="mode-btn active-mode" onclick="setMode('train')">TRAIN</div>
            <div id="btn-test" class="mode-btn" onclick="setMode('test')">TEST</div>
        </div>

        <div id="train-grid">
            <button class="stage-btn" onclick="addSample(0)">S1 <span class="count-badge" id="c0">0</span></button>
            <button class="stage-btn" onclick="addSample(1)">S2 <span class="count-badge" id="c1">0</span></button>
            <button class="stage-btn" onclick="addSample(2)">S3 <span class="count-badge" id="c2">0</span></button>
            <button class="stage-btn" onclick="addSample(3)">S4 <span class="count-badge" id="c3">0</span></button>
            <button class="stage-btn" onclick="addSample(4)">S5 <span class="count-badge" id="c4">0</span></button>
            <button class="stage-btn" onclick="addSample(5)">S6 <span class="count-badge" id="c5">0</span></button>
            <button class="stage-btn" onclick="addSample(6)">S7 <span class="count-badge" id="c6">0</span></button>
            <button class="stage-btn" onclick="downloadBackup()" style="background:#222;"><i class="bi bi-download"></i></button>
        </div>

        <div id="test-view">
            <div id="prediction-text">READY</div>
            <div id="confidence-bar">Point at banana to test</div>
        </div>

        <div class="action-bar">
            <button class="btn btn-sync" id="sync-btn" onclick="syncToGithub()">SYNC TO CLOUD</button>
            <button class="btn btn-purge" onclick="purgeMemory()">RESET</button>
        </div>
    </div>

    <script>
        // --- GITHUB CONFIGURATION ---
        const GH_TOKEN = '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'; 
        const GH_REPO = 'PulpPro/banana-brain'; 
        const GH_PATH = 'scanner/banana_brain.json';
        
        let classifier, mobilenet;
        const webcamElement = document.getElementById('webcam');
        const counts = [0, 0, 0, 0, 0, 0, 0];
        let currentMode = 'train';

        async function init() {
            try {
                classifier = knnClassifier.create();
                mobilenet = await mobilenet.load();
                
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' }, 
                    audio: false 
                });
                webcamElement.srcObject = stream;
                
                document.getElementById('status-msg').innerText = "Checking Cloud for existing Brain...";
                await loadFromCloud();
                requestAnimationFrame(predictLoop);
            } catch (err) {
                document.getElementById('status-msg').innerText = "Camera access denied or Error.";
            }
        }

        async function loadFromCloud() {
            try {
                const res = await fetch(`https://raw.githubusercontent.com/${GH_REPO}/main/${GH_PATH}?t=${Date.now()}`);
                if (!res.ok) throw new Error();
                
                const data = await res.json();
                const tensorObj = {};
                Object.keys(data).forEach(key => {
                    tensorObj[key] = tf.tensor2d(data[key], [data[key].length / 1024, 1024]);
                });
                classifier.setClassifierDataset(tensorObj);
                document.getElementById('status-msg').innerText = "Cloud Brain Synced & Loaded.";
            } catch (e) {
                document.getElementById('status-msg').innerText = "Starting with fresh Brain.";
            }
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-train').classList.toggle('active-mode', mode === 'train');
            document.getElementById('btn-test').classList.toggle('active-mode', mode === 'test');
            document.getElementById('train-grid').style.display = mode === 'train' ? 'grid' : 'none';
            document.getElementById('test-view').style.display = mode === 'test' ? 'flex' : 'none';
        }

        async function addSample(label) {
            const img = await tf.browser.fromPixels(webcamElement);
            const activation = mobilenet.infer(img, 'conv_preds');
            classifier.addExample(activation, label);
            
            counts[label]++;
            document.getElementById(`c${label}`).innerText = counts[label];
            img.dispose();
        }

        async function predictLoop() {
            if (currentMode === 'test' && classifier.getNumClasses() > 0) {
                const img = await tf.browser.fromPixels(webcamElement);
                const activation = mobilenet.infer(img, 'conv_preds');
                const result = await classifier.predictClass(activation);
                
                const stages = ["Stage 1", "Stage 2", "Stage 3", "Stage 4", "Stage 5", "Stage 6", "Stage 7"];
                document.getElementById('prediction-text').innerText = stages[result.label];
                document.getElementById('confidence-bar').innerText = `${Math.floor(result.confidences[result.label] * 100)}% Confidence`;
                
                img.dispose();
            }
            requestAnimationFrame(predictLoop);
        }

        async function syncToGithub() {
            const btn = document.getElementById('sync-btn');
            const originalText = btn.innerText;
            btn.innerText = "UPLOADING...";
            
            let dataset = classifier.getClassifierDataset();
            let datasetObj = {};
            Object.keys(dataset).forEach(key => {
                datasetObj[key] = Array.from(dataset[key].dataSync());
            });
            const content = btoa(JSON.stringify(datasetObj));

            try {
                const getFile = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_PATH}`, {
                    headers: { 'Authorization': `token ${GH_TOKEN}` }
                });
                
                let sha = null;
                if (getFile.ok) {
                    const fileData = await getFile.json();
                    sha = fileData.sha;
                }

                const response = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_PATH}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${GH_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: "AI Brain Update from iPhone", 
                        content: content, 
                        sha: sha 
                    })
                });

                if (response.ok) { 
                    alert("Sync Complete! Your brain is safe in the cloud."); 
                } else { 
                    alert("Sync Error. Double check your Repo path."); 
                }
            } catch (err) { 
                alert("Network Error: Could not reach GitHub."); 
            }
            btn.innerText = originalText;
        }

        function downloadBackup() {
            let dataset = classifier.getClassifierDataset();
            let datasetObj = {};
            Object.keys(dataset).forEach(key => {
                datasetObj[key] = Array.from(dataset[key].dataSync());
            });
            let blob = new Blob([JSON.stringify(datasetObj)], {type: "application/json"});
            let a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "banana_backup.json";
            a.click();
        }

        function purgeMemory() { 
            if(confirm("Reset local session? (Does not delete cloud file unless you sync)")) { 
                classifier.clearAllClasses(); 
                counts.fill(0); 
                location.reload(); 
            } 
        }
        
        init();
    </script>
</body>
</html>
