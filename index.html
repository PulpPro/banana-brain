<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Banana Brain</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --bg: #000;
            --card: #111;
            --card2: #1a1a1a;
            --border: #222;
            --border2: #2a2a2a;
            --accent: #f9d71c;
            --lime: #a6e22e;
            --red: #ff4d4d;
            --dim: #555;
            --text: #fff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body {
            background: var(--bg); color: var(--text);
            font-family: -apple-system, sans-serif;
            height: 100%; overflow: hidden;
        }
        body { display: flex; flex-direction: column; height: 100dvh; }

        /* ── MAIN APP ── */
        #app { display: flex; flex-direction: column; height: 100dvh; }

        /* ── HEADER ── */
        .header {
            background: var(--card); padding: 10px 14px 8px;
            border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .app-title { font-size: 0.72rem; font-weight: 900; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
        .app-status { font-size: 0.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); }
        .app-status.ready { color: var(--lime); }
        .app-status.busy { color: var(--accent); animation: pulse 1.2s infinite; }
        .app-status.err { color: var(--red); }
        .stage-pips { display: flex; gap: 3px; }
        .pip { flex: 1; height: 3px; border-radius: 3px; background: var(--border2); transition: background 0.3s; }
        .pip.done { background: var(--accent); }
        .pip.active { background: #fff; }

        /* ── CAMERA — wide rectangle, short height ── */
        #cam-wrap {
            position: relative;
            width: 100%;
            height: 32vh; /* Short height — fits box at 1m distance */
            background: #000;
            flex-shrink: 0;
            overflow: hidden;
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Wide rectangle crop */
            display: block;
        }
        /* Rectangle crosshair matching box shape */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80%; height: 75%;
            border: 2px solid rgba(249,215,28,0.65);
            border-radius: 8px; pointer-events: none;
        }
        #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.08s; }
        #stage-overlay {
            position: absolute; top: 10px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.72);
            border: 1px solid var(--accent);
            padding: 4px 12px; border-radius: 20px;
            font-size: 0.58rem; font-weight: 900;
            color: var(--accent); text-transform: uppercase;
            letter-spacing: 2px; white-space: nowrap; display: none;
        }
        #cam-init {
            position: absolute; inset: 0; background: #000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 8px; cursor: pointer;
        }
        #cam-init.hidden { display: none; }
        #cam-init i { font-size: 2rem; color: var(--accent); }
        #cam-init-title { font-size: 0.75rem; font-weight: 900; color: var(--accent); letter-spacing: 2px; }
        #cam-init-sub { font-size: 0.52rem; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
        #cam-init-prog { font-size: 0.52rem; color: var(--lime); text-transform: uppercase; letter-spacing: 1px; animation: pulse 1.2s infinite; display: none; }

        /* Capture button — sits on right side of camera */
        #capture-btn {
            position: absolute; bottom: 10px; right: 14px;
            width: 52px; height: 52px; border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.9);
            background: transparent; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s;
        }
        #capture-btn:active { transform: scale(0.9); }
        #capture-btn.disabled { opacity: 0.25; pointer-events: none; }
        .capture-inner { width: 40px; height: 40px; border-radius: 50%; background: #fff; }

        /* ── BOTTOM PANEL ── */
        #bottom-panel { flex: 1; display: flex; flex-direction: column; background: var(--card); overflow: hidden; min-height: 0; }

        /* Thumbnails */
        #thumb-section { padding: 7px 10px 6px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        #thumb-label {
            font-size: 0.46rem; font-weight: 700; color: var(--dim);
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px;
            display: flex; justify-content: space-between;
        }
        #thumb-label span { color: var(--accent); }
        #thumb-row { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; }
        #thumb-row::-webkit-scrollbar { display: none; }
        .thumb {
            width: 56px; height: 44px; border-radius: 7px;
            background: var(--card2); border: 1.5px solid var(--border2);
            flex-shrink: 0; position: relative; overflow: hidden;
            cursor: pointer; transition: border-color 0.15s;
        }
        .thumb.selected { border-color: var(--accent); }
        .thumb-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .thumb-badge {
            position: absolute; bottom: 2px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.82);
            border-radius: 4px; padding: 1px 5px;
            font-size: 7px; font-weight: 900;
            color: var(--accent); white-space: nowrap;
        }
        .thumb-check {
            position: absolute; top: 2px; right: 2px;
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--accent); color: #000;
            font-size: 8px; font-weight: 900;
            display: flex; align-items: center; justify-content: center;
        }
        .thumb-del {
            position: absolute; top: 2px; left: 2px;
            width: 14px; height: 14px; border-radius: 50%;
            background: rgba(255,77,77,0.85); color: #fff;
            font-size: 8px; font-weight: 900;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 10;
        }
        .thumb-empty {
            display: flex; align-items: center;
            justify-content: center;
            font-size: 18px; color: rgba(255,255,255,0.1);
        }

        /* Stage grid */
        #stage-section { padding: 7px 10px 6px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        #stage-label {
            font-size: 0.46rem; font-weight: 700; color: var(--dim);
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px;
            display: flex; justify-content: space-between;
        }
        #stage-label span { color: var(--accent); }
        #stage-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
        .stage-btn {
            background: var(--card2); border: 1px solid var(--border2);
            border-radius: 8px; color: var(--text);
            font-size: 0.68rem; font-weight: 900;
            padding: 8px 0; cursor: pointer;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 1px; transition: all 0.12s;
        }
        .stage-btn:active { transform: scale(0.93); }
        .stage-btn.selected { background: rgba(249,215,28,0.14); border-color: var(--accent); color: var(--accent); }
        .stage-btn.has-data { border-color: rgba(249,215,28,0.35); }
        .s-count { font-size: 0.42rem; color: var(--accent); font-weight: 700; }

        /* Action bar */
        #action-bar {
            display: flex; gap: 6px;
            padding: 8px 10px max(env(safe-area-inset-bottom), 10px);
            flex-shrink: 0;
        }
        .act-btn {
            flex: 1; padding: 12px; border-radius: 10px; border: none;
            font-weight: 900; font-size: 0.65rem;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 5px;
            transition: opacity 0.15s;
        }
        .act-btn:active { opacity: 0.7; }
        #assign-btn { background: var(--card2); color: var(--text); border: 1px solid var(--border2); }
        #upload-btn { background: var(--accent); color: #000; }
        #upload-btn.disabled { opacity: 0.3; pointer-events: none; }
        #stats-btn { flex: 0 0 auto; padding: 12px 14px; background: var(--card2); color: var(--text); border: 1px solid var(--border2); border-radius: 10px; cursor: pointer; font-size: 1rem; }

        /* ── DRIVE CONNECT SCREEN ── */
        #drive-screen {
            position: fixed; inset: 0; background: #000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 16px; z-index: 100; padding: 30px;
        }
        #drive-screen.hidden { display: none; }
        #drive-screen i { font-size: 3rem; color: #4285f4; }
        #drive-screen h2 { font-size: 0.9rem; font-weight: 900; color: #fff; letter-spacing: 2px; text-align: center; }
        #drive-screen p { font-size: 0.6rem; color: var(--dim); text-align: center; line-height: 1.6; }
        #connect-drive-btn {
            background: #4285f4; color: #fff; border: none;
            padding: 16px 32px; border-radius: 100px;
            font-weight: 900; font-size: 0.8rem;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
            display: flex; align-items: center; gap: 8px;
        }

        /* ── STATS PANEL ── */
        #stats-panel {
            position: fixed; inset: 0; background: rgba(0,0,0,0.96);
            z-index: 200; display: flex; flex-direction: column;
            padding: 20px 16px;
        }
        #stats-panel.hidden { display: none; }
        .stats-title { font-size: 0.7rem; font-weight: 900; color: var(--accent); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px; }
        .stats-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; }
        .stats-row {
            display: flex; align-items: center; gap: 10px;
            background: var(--card2); border: 1px solid var(--border2);
            border-radius: 10px; padding: 10px 12px;
        }
        .stats-stage { font-size: 0.8rem; font-weight: 900; min-width: 34px; }
        .stats-bar-wrap { flex: 1; height: 5px; background: var(--border2); border-radius: 5px; overflow: hidden; }
        .stats-bar { height: 100%; background: var(--accent); border-radius: 5px; }
        .stats-count { font-size: 0.6rem; font-weight: 900; color: var(--accent); min-width: 52px; text-align: right; }
        .stats-total { font-size: 0.55rem; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 12px; text-align: center; }
        #close-stats {
            margin-top: 12px; padding: 14px; border-radius: 10px;
            background: var(--card2); border: 1px solid var(--border2);
            color: var(--text); font-weight: 900; font-size: 0.72rem;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
        }

        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    </style>
</head>
<body>

<!-- Google Drive Connect Screen -->
<div id="drive-screen">
    <i class="bi bi-cloud-fill"></i>
    <h2>Connect Google Drive</h2>
    <p>Photos save directly to Google Drive — nothing stored on your phone.</p>
    <button id="connect-drive-btn" onclick="connectDrive()">
        <i class="bi bi-google"></i> Connect Drive
    </button>
</div>

<!-- Main App -->
<div id="app">

    <div class="header">
        <div class="header-row">
            <div class="app-title">🍌 Banana Brain</div>
            <div class="app-status" id="appStatus">Starting...</div>
        </div>
        <div class="stage-pips" id="stagePips"></div>
    </div>

    <!-- Rectangle camera — wide, short -->
    <div id="cam-wrap">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="crosshair"></div>
        <div id="flash"></div>
        <div id="stage-overlay"></div>
        <div id="cam-init" onclick="startCamera()">
            <i class="bi bi-camera-fill"></i>
            <div id="cam-init-title">Tap to Start Camera</div>
            <div id="cam-init-sub">Point at open banana box</div>
            <div id="cam-init-prog"></div>
        </div>
        <button id="capture-btn" class="disabled" onclick="capturePhoto()">
            <div class="capture-inner"></div>
        </button>
    </div>

    <div id="bottom-panel">

        <div id="thumb-section">
            <div id="thumb-label">Photos <span id="selectedCount"></span></div>
            <div id="thumb-row"></div>
        </div>

        <div id="stage-section">
            <div id="stage-label">Select color stage <span id="stageInfo"></span></div>
            <div id="stage-grid"></div>
        </div>

        <div id="action-bar">
            <button class="act-btn" id="assign-btn" onclick="assignStage()">
                <i class="bi bi-tag-fill"></i> Assign Color
            </button>
            <button class="act-btn disabled" id="upload-btn" onclick="uploadAll()">
                <i class="bi bi-cloud-upload-fill"></i> Upload All
            </button>
            <button id="stats-btn" onclick="showStats()">
                <i class="bi bi-bar-chart-fill"></i>
            </button>
        </div>

    </div>
</div>

<!-- Stats Panel -->
<div id="stats-panel" class="hidden">
    <div class="stats-title">📊 Training Stats</div>
    <div class="stats-list" id="statsList"></div>
    <div class="stats-total" id="statsTotal"></div>
    <button id="close-stats" onclick="hideStats()">← Back</button>
</div>

<script>
const CLIENT_ID    = '491662852792-0aplippkbgi2upk9qour1hvomcfb11ta.apps.googleusercontent.com';
const REDIRECT_URI = window.location.origin + window.location.pathname;
const SCOPES       = 'https://www.googleapis.com/auth/drive.file';
const FOLDER_NAME  = 'banana-brain';
const STAGES       = ['1','1.5','2','2.5','3','3.5','4','4.5','5','5.5','6'];

let accessToken    = null;
let rootFolderId   = null;
let stageFolderIds = {};
let photoCounts    = {};
let selectedStage  = null;
let cameraReady    = false;
let cameraStream   = null;
let captures       = [];
let selectedIds    = new Set();

STAGES.forEach(s => photoCounts[s] = 0);

// ── BOOT ──────────────────────────────────────────────────────
window.addEventListener('load', () => {
    const hash = window.location.hash;
    if (hash && hash.includes('access_token')) {
        const hp = new URLSearchParams(hash.substring(1));
        const token = hp.get('access_token');
        if (token) {
            accessToken = token;
            window.history.replaceState({}, '', REDIRECT_URI);
            launchApp(true);
            return;
        }
    }
    document.getElementById('drive-screen').classList.remove('hidden');
});

// ── OAUTH ─────────────────────────────────────────────────────
function connectDrive() {
    const url = 'https://accounts.google.com/o/oauth2/v2/auth'
        + '?client_id=' + encodeURIComponent(CLIENT_ID)
        + '&redirect_uri=' + encodeURIComponent(REDIRECT_URI)
        + '&response_type=token'
        + '&scope=' + encodeURIComponent(SCOPES);
    window.location.href = url;
}

// ── LAUNCH ────────────────────────────────────────────────────
async function launchApp(hasDrive) {
    document.getElementById('drive-screen').classList.add('hidden');
    document.getElementById('app').style.display = 'flex';
    buildStageGrid();
    buildPips();
    renderThumbs();

    if (hasDrive) {
        setStatus('Setting up Drive folders...', 'busy');
        try {
            rootFolderId = await getOrCreateFolder(FOLDER_NAME, 'root');
            await loadCounts();
            setStatus('Drive ready — tap camera to start', 'ready');
        } catch (e) {
            setStatus('Drive error: ' + e.message, 'err');
        }
    }
}

// ── CAMERA ────────────────────────────────────────────────────
async function startCamera() {
    const init = document.getElementById('cam-init');
    const prog = document.getElementById('cam-init-prog');
    const sub  = document.getElementById('cam-init-sub');
    sub.style.display = 'none';
    prog.style.display = 'block';
    prog.innerText = 'Requesting camera...';

    try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: { ideal: 'environment' },
                width: { ideal: 1920 },
                height: { ideal: 1080 },
                aspectRatio: { ideal: 16/9 }
            },
            audio: false
        });
        const vid = document.getElementById('webcam');
        vid.srcObject = cameraStream;
        await new Promise(r => { vid.onloadedmetadata = r; });
        vid.play();
        init.classList.add('hidden');
        cameraReady = true;
        if (selectedStage) document.getElementById('capture-btn').classList.remove('disabled');
        setStatus('Camera ready — select a color stage', 'ready');
    } catch (err) {
        prog.style.color = 'var(--red)';
        prog.innerText = err.name === 'NotAllowedError'
            ? 'Camera blocked — AA menu > Website Settings > Camera > Allow'
            : 'Camera error: ' + err.message;
    }
}

function restartCamera() {
    // Properly restart camera after clear
    if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
    }
    cameraReady = false;
    const vid = document.getElementById('webcam');
    vid.srcObject = null;
    document.getElementById('capture-btn').classList.add('disabled');

    // Short delay then restart
    setTimeout(() => startCamera(), 300);
}

// ── CAPTURE ───────────────────────────────────────────────────
function capturePhoto() {
    if (!cameraReady) return;
    const flash = document.getElementById('flash');
    flash.style.opacity = '1';
    setTimeout(() => flash.style.opacity = '0', 120);

    const vid = document.getElementById('webcam');
    const canvas = document.createElement('canvas');
    canvas.width = vid.videoWidth;
    canvas.height = vid.videoHeight;
    canvas.getContext('2d').drawImage(vid, 0, 0);

    canvas.toBlob(blob => {
        const id = 'cap_' + Date.now() + '_' + Math.random().toString(36).substr(2,5);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.88);
        captures.push({ id, dataUrl, blob, stage: selectedStage });
        selectedIds.add(id);
        renderThumbs();
        updateUploadBtn();
        setStatus(`Photo captured — ${captures.length} in session`, 'ready');
    }, 'image/jpeg', 0.88);
}

// ── STAGE SELECTION ───────────────────────────────────────────
function selectStage(stage) {
    selectedStage = stage;
    STAGES.forEach(s => {
        const btn = document.getElementById('sb-' + s.replace('.','_'));
        if (btn) btn.classList.toggle('selected', s === stage);
        const pip = document.getElementById('pip-' + s.replace('.','_'));
        if (pip) pip.classList.toggle('active', s === stage);
    });
    const ov = document.getElementById('stage-overlay');
    ov.innerText = 'Color ' + stage + ' selected';
    ov.style.display = 'block';
    document.getElementById('stageInfo').innerText = '· C' + stage + ' (' + (photoCounts[stage] || 0) + ' saved)';
    if (cameraReady) document.getElementById('capture-btn').classList.remove('disabled');
}

// ── ASSIGN STAGE ──────────────────────────────────────────────
function assignStage() {
    if (!selectedStage) { setStatus('Select a color stage first!', 'err'); return; }
    if (selectedIds.size === 0) { setStatus('Select photos first!', 'err'); return; }
    captures.forEach(c => { if (selectedIds.has(c.id)) c.stage = selectedStage; });
    renderThumbs();
    setStatus(`Assigned Color ${selectedStage} to ${selectedIds.size} photo(s)`, 'ready');
}

// ── DELETE SINGLE CAPTURE ─────────────────────────────────────
function deleteCapture(id) {
    captures = captures.filter(c => c.id !== id);
    selectedIds.delete(id);
    renderThumbs();
    updateUploadBtn();
    setStatus(`Photo removed — ${captures.length} remaining`, captures.length > 0 ? 'ready' : '');
}

// ── CLEAR ALL — fixed: restarts camera properly ───────────────
function clearCaptures() {
    if (captures.length === 0) return;
    if (!confirm('Clear all captured photos?')) return;
    captures = [];
    selectedIds.clear();
    renderThumbs();
    updateUploadBtn();
    setStatus('Cleared — restarting camera...', 'busy');
    restartCamera(); // ← Fix: properly restart camera
}

// ── UPLOAD ALL ────────────────────────────────────────────────
async function uploadAll() {
    const toUpload = captures.filter(c => c.stage);
    if (toUpload.length === 0) { setStatus('Assign a color stage to photos first!', 'err'); return; }
    if (!accessToken) { setStatus('Not connected to Drive!', 'err'); return; }

    const btn = document.getElementById('upload-btn');
    btn.classList.add('disabled');
    setStatus('Uploading to Google Drive...', 'busy');

    let uploaded = 0;
    for (const cap of toUpload) {
        try {
            const folderId = await getOrCreateStageFolder(cap.stage);
            const filename = `color_${cap.stage}_${Date.now()}_${uploaded}.jpg`;
            await uploadFile(cap.blob, filename, folderId);
            photoCounts[cap.stage] = (photoCounts[cap.stage] || 0) + 1;
            updateCount(cap.stage);
            uploaded++;
            setStatus(`Uploading... ${uploaded}/${toUpload.length}`, 'busy');
        } catch (e) {
            setStatus('Upload failed: ' + e.message, 'err');
            btn.classList.remove('disabled');
            return;
        }
    }

    captures = captures.filter(c => !c.stage);
    selectedIds.clear();
    renderThumbs();
    updateUploadBtn();
    setStatus(`✓ ${uploaded} photos saved to Google Drive!`, 'ready');
    btn.classList.remove('disabled');
}

// ── GOOGLE DRIVE API ──────────────────────────────────────────
async function driveRequest(url, options = {}) {
    const res = await fetch(url, {
        ...options,
        headers: { 'Authorization': 'Bearer ' + accessToken, ...(options.headers || {}) }
    });
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || 'Drive error ' + res.status);
    }
    return res.json();
}

async function getOrCreateFolder(name, parentId) {
    const q = `name='${name}' and mimeType='application/vnd.google-apps.folder' and '${parentId}' in parents and trashed=false`;
    const search = await driveRequest(
        `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id)`
    );
    if (search.files && search.files.length > 0) return search.files[0].id;
    const created = await driveRequest('https://www.googleapis.com/drive/v3/files', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, mimeType: 'application/vnd.google-apps.folder', parents: [parentId] })
    });
    return created.id;
}

async function getOrCreateStageFolder(stage) {
    if (stageFolderIds[stage]) return stageFolderIds[stage];
    const id = await getOrCreateFolder('stage-' + stage, rootFolderId);
    stageFolderIds[stage] = id;
    return id;
}

async function uploadFile(blob, filename, folderId) {
    const meta = JSON.stringify({ name: filename, parents: [folderId] });
    const form = new FormData();
    form.append('metadata', new Blob([meta], { type: 'application/json' }));
    form.append('file', blob);
    const res = await fetch(
        'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',
        { method: 'POST', headers: { 'Authorization': 'Bearer ' + accessToken }, body: form }
    );
    if (!res.ok) throw new Error('Upload failed ' + res.status);
    return res.json();
}

async function loadCounts() {
    for (const stage of STAGES) {
        try {
            const folderId = await getOrCreateStageFolder(stage);
            const q = `'${folderId}' in parents and trashed=false`;
            const res = await driveRequest(
                `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id)`
            );
            photoCounts[stage] = res.files ? res.files.length : 0;
            updateCount(stage);
        } catch (e) {}
    }
}

// ── UI HELPERS ────────────────────────────────────────────────
function buildStageGrid() {
    document.getElementById('stage-grid').innerHTML = STAGES.map(s => `
        <button class="stage-btn" id="sb-${s.replace('.','_')}" onclick="selectStage('${s}')">
            ${s}<span class="s-count" id="sc-${s.replace('.','_')}">${photoCounts[s]}</span>
        </button>
    `).join('') + `<button class="stage-btn" style="background:#1a0000;border-color:#330000;font-size:0.6rem;color:var(--red);" onclick="clearCaptures()">CLR<span class="s-count" style="color:var(--red);">ALL</span></button>`;
}

function buildPips() {
    document.getElementById('stagePips').innerHTML = STAGES.map(s =>
        `<div class="pip" id="pip-${s.replace('.','_')}"></div>`
    ).join('');
}

function updateCount(stage) {
    const key = stage.replace('.','_');
    const el = document.getElementById('sc-' + key);
    if (el) el.innerText = photoCounts[stage];
    const btn = document.getElementById('sb-' + key);
    if (btn) btn.classList.toggle('has-data', photoCounts[stage] > 0);
    const pip = document.getElementById('pip-' + key);
    if (pip) pip.classList.toggle('done', photoCounts[stage] > 0);
}

function renderThumbs() {
    const row = document.getElementById('thumb-row');
    const sel = selectedIds.size;
    document.getElementById('selectedCount').innerText = sel > 0 ? `· ${sel} selected` : '';

    if (captures.length === 0) {
        row.innerHTML = Array(6).fill(0).map(() =>
            `<div class="thumb thumb-empty">+</div>`
        ).join('');
        return;
    }

    row.innerHTML = captures.map(c => `
        <div class="thumb ${selectedIds.has(c.id) ? 'selected' : ''}" onclick="toggleThumb('${c.id}')">
            <img class="thumb-img" src="${c.dataUrl}">
            ${c.stage ? `<div class="thumb-badge">C${c.stage}</div>` : ''}
            ${selectedIds.has(c.id) ? `<div class="thumb-check">✓</div>` : ''}
            <div class="thumb-del" onclick="event.stopPropagation(); deleteCapture('${c.id}')">✕</div>
        </div>
    `).join('');
}

function toggleThumb(id) {
    if (selectedIds.has(id)) selectedIds.delete(id);
    else selectedIds.add(id);
    renderThumbs();
    updateUploadBtn();
}

function updateUploadBtn() {
    const ready = captures.filter(c => c.stage).length;
    const btn = document.getElementById('upload-btn');
    btn.classList.toggle('disabled', ready === 0);
    btn.innerHTML = `<i class="bi bi-cloud-upload-fill"></i> Upload${ready > 0 ? ' (' + ready + ')' : ' All'}`;
}

function setStatus(msg, type) {
    const el = document.getElementById('appStatus');
    el.innerText = msg;
    el.className = 'app-status ' + (type || '');
}

function showStats() {
    const list = document.getElementById('statsList');
    const total = document.getElementById('statsTotal');
    const max = Math.max(...STAGES.map(s => photoCounts[s]), 1);
    const totalPhotos = STAGES.reduce((sum, s) => sum + photoCounts[s], 0);
    const minCount = Math.min(...STAGES.map(s => photoCounts[s]));
    const needed = Math.max(0, 200 - minCount);

    list.innerHTML = STAGES.map(s => `
        <div class="stats-row">
            <div class="stats-stage">C${s}</div>
            <div class="stats-bar-wrap">
                <div class="stats-bar" style="width:${Math.round((photoCounts[s]/max)*100)}%"></div>
            </div>
            <div class="stats-count">${photoCounts[s]} photos</div>
        </div>
    `).join('');

    total.innerText = `Total: ${totalPhotos} photos · ${needed > 0 ? `Need ${needed} more per stage for training` : '✓ Ready to train!'}`;
    document.getElementById('stats-panel').classList.remove('hidden');
}

function hideStats() {
    document.getElementById('stats-panel').classList.add('hidden');
}
</script>
