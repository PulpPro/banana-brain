<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pulp Pro | AI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <style>
        :root { --bg: #000; --accent: #f9d71c; }
        body { background: var(--bg); color: #fff; font-family: -apple-system; margin: 0; overflow: hidden; position: fixed; width: 100%; height: 100%; }
        #video-container { position: relative; width: 100vw; height: 40vh; background: #111; }
        #webcam { width: 100%; height: 100%; object-fit: cover; background: #000; }
        #init-overlay { position: absolute; z-index: 100; background: #000; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .controls { height: 60vh; padding: 10px; background: #0a0a0a; display: flex; flex-direction: column; }
        #train-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; flex-grow: 1; }
        .stage-btn { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; padding: 10px 0; }
        .count-badge { display: block; font-size: 10px; color: var(--accent); }
        .action-bar { display: flex; gap: 8px; padding-bottom: 20px; }
        .btn { flex: 1; padding: 15px; border-radius: 12px; border: none; font-weight: bold; }
    </style>
</head>
<body>

    <div id="video-container">
        <div id="init-overlay" onclick="emergencyStart()">
            <i class="bi bi-camera-fill" style="font-size: 50px; color: var(--accent);"></i>
            <h2 style="color:var(--accent);">FORCE START CAMERA</h2>
            <p style="opacity:0.7;">Tap to bypass iOS restrictions</p>
        </div>
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <div class="controls">
        <div id="status-msg" style="text-align:center; font-size:10px; color:#888; margin-bottom:5px;">LENS READY</div>
        
        <div id="train-grid">
            <button class="stage-btn" onclick="addSample('1')">1 <span class="count-badge" id="c1">0</span></button>
            <button class="stage-btn" onclick="addSample('1.5')">1.5 <span class="count-badge" id="c1.5">0</span></button>
            <button class="stage-btn" onclick="addSample('2')">2 <span class="count-badge" id="c2">0</span></button>
            <button class="stage-btn" onclick="addSample('2.5')">2.5 <span class="count-badge" id="c2.5">0</span></button>
            <button class="stage-btn" onclick="addSample('3')">3 <span class="count-badge" id="c3">0</span></button>
            <button class="stage-btn" onclick="addSample('3.5')">3.5 <span class="count-badge" id="c3.5">0</span></button>
            <button class="stage-btn" onclick="addSample('4')">4 <span class="count-badge" id="c4">0</span></button>
            <button class="stage-btn" onclick="addSample('4.5')">4.5 <span class="count-badge" id="c4.5">0</span></button>
            <button class="stage-btn" onclick="addSample('5')">5 <span class="count-badge" id="c5">0</span></button>
            <button class="stage-btn" onclick="addSample('5.5')">5.5 <span class="count-badge" id="c5.5">0</span></button>
            <button class="stage-btn" onclick="addSample('6')">6 <span class="count-badge" id="c6">0</span></button>
            <button class="stage-btn" onclick="location.reload()" style="background:#331111;">RELOAD</button>
        </div>

        <div class="action-bar">
            <button class="btn" style="background:#222; color:#fff;" onclick="undoLast()">UNDO</button>
            <button class="btn" id="sync-btn" style="background:#fff; color:#000;" onclick="syncToGithub()">SYNC CLOUD</button>
        </div>
    </div>

    <script>
        const GH_TOKEN = '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'; 
        const GH_REPO = 'PulpPro/banana-brain'; 
        const GH_PATH = 'scanner/banana_brain.json';
        
        let classifier, mobilenet;
        const webcamElement = document.getElementById('webcam');
        const counts = {"1":0,"1.5":0,"2":0,"2.5":0,"3":0,"3.5":0,"4":0,"4.5":0,"5":0,"5.5":0,"6":0};
        let lastLabel = null;

        async function emergencyStart() {
            document.getElementById('status-msg').innerText = "POWERING ON...";
            classifier = knnClassifier.create();
            mobilenet = await mobilenet.load();

            try {
                // Try the simplest possible camera request for iOS
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: true, 
                    audio: false 
                });
                
                webcamElement.srcObject = stream;
                // Force play command
                webcamElement.onloadedmetadata = () => {
                    webcamElement.play();
                    document.getElementById('init-overlay').style.display = 'none';
                    document.getElementById('status-msg').innerText = "AI ONLINE";
                };

                await loadFromCloud();
                requestAnimationFrame(predictLoop);
            } catch (err) {
                alert("STILL BLOCKED: Use the 'AA' menu > Website Settings > Camera > ALLOW.");
            }
        }

        async function loadFromCloud() {
            try {
                const res = await fetch(`https://raw.githubusercontent.com/${GH_REPO}/main/${GH_PATH}?t=${Date.now()}`);
                if (!res.ok) return;
                const data = await res.json();
                const tensorObj = {};
                Object.keys(data).forEach(key => {
                    tensorObj[key] = tf.tensor2d(data[key], [data[key].length / 1024, 1024]);
                    counts[key] = Math.floor(data[key].length / 1024);
                    document.getElementById(`c${key}`).innerText = counts[key];
                });
                classifier.setClassifierDataset(tensorObj);
            } catch (e) {}
        }

        async function addSample(label) {
            const img = await tf.browser.fromPixels(webcamElement);
            const activation = mobilenet.infer(img, 'conv_preds');
            classifier.addExample(activation, label);
            counts[label]++;
            document.getElementById(`c${label}`).innerText = counts[label];
            lastLabel = label;
            img.dispose();
        }

        function undoLast() {
            if (!lastLabel || counts[lastLabel] === 0) return;
            classifier.clearClass(lastLabel);
            counts[lastLabel] = 0;
            document.getElementById(`c${lastLabel}`).innerText = "0";
            lastLabel = null;
        }

        async function predictLoop() {
            if (classifier.getNumClasses() > 0) {
                const img = await tf.browser.fromPixels(webcamElement);
                const activation = mobilenet.infer(img, 'conv_preds');
                const result = await classifier.predictClass(activation);
                document.getElementById('status-msg').innerText = "DETECTED: " + result.label;
                img.dispose();
            }
            requestAnimationFrame(predictLoop);
        }

        async function syncToGithub() {
            const btn = document.getElementById('sync-btn');
            btn.innerText = "...";
            let dataset = classifier.getClassifierDataset();
            let datasetObj = {};
            Object.keys(dataset).forEach(key => {
                datasetObj[key] = Array.from(dataset[key].dataSync());
            });
            const content = btoa(JSON.stringify(datasetObj));
            try {
                const getFile = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_PATH}`, {
                    headers: { 'Authorization': `token ${GH_TOKEN}` }
                });
                let sha = null;
                if (getFile.ok) {
                    const fileData = await getFile.json();
                    sha = fileData.sha;
                }
                await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_PATH}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${GH_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: "AI Update", content: content, sha: sha })
                });
                alert("CLOUD SAVED");
            } catch (err) { alert("SYNC FAILED"); }
            btn.innerText = "SYNC CLOUD";
        }
    </script>
</body>
</html>
