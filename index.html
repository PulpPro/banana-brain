<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pulp Pro | AI Trainer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <style>
        :root { --bg: #000; --accent: #f9d71c; --glass: rgba(255, 255, 255, 0.1); }
        body { background: var(--bg); color: #fff; font-family: -apple-system, system-ui; margin: 0; overflow: hidden; position: fixed; width: 100%; }
        
        #video-container { position: relative; width: 100vw; height: 45vh; background: #111; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #webcam { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        /* The Big Start Button */
        #init-overlay { position: absolute; z-index: 10; text-align: center; background: rgba(0,0,0,0.8); width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .start-icon { font-size: 60px; color: var(--accent); margin-bottom: 10px; }

        .controls { height: 55vh; padding: 15px; background: #0a0a0a; border-top: 1px solid var(--glass); display: flex; flex-direction: column; box-sizing: border-box; }
        .mode-toggle { display: flex; background: var(--glass); border-radius: 12px; margin-bottom: 10px; padding: 4px; }
        .mode-btn { flex: 1; padding: 12px; text-align: center; font-weight: bold; border-radius: 10px; cursor: pointer; }
        .active-mode { background: var(--accent); color: #000; }
        
        #train-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex-grow: 1; }
        .stage-btn { background: #1a1a1a; border: 1px solid var(--glass); border-radius: 8px; color: #fff; font-size: 13px; padding: 12px 2px; font-weight: bold; }
        .stage-btn:active { background: var(--accent); color: #000; }
        .count-badge { display: block; font-size: 9px; opacity: 0.5; margin-top: 2px; }
        
        #test-view { display: none; text-align: center; flex-grow: 1; justify-content: center; align-items: center; flex-direction: column; border: 2px dashed var(--glass); border-radius: 15px; margin: 10px 0; }
        
        .action-bar { display: flex; gap: 8px; padding-top: 10px; padding-bottom: env(safe-area-inset-bottom); }
        .btn { flex: 1; padding: 16px; border-radius: 12px; border: none; font-weight: bold; font-size: 14px; }
        .btn-sync { background: #fff; color: #000; }
        .btn-undo { background: #222; color: #fff; border: 1px solid var(--glass); }
        #status-msg { font-size: 10px; text-align: center; margin-bottom: 5px; color: #888; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="video-container">
        <div id="init-overlay" onclick="startApp()">
            <i class="bi bi-play-circle-fill start-icon"></i>
            <p style="font-weight: bold; letter-spacing: 1px;">START CAMERA & LOAD AI</p>
            <p style="font-size: 12px; opacity: 0.6;">(Tap to authorize Safari)</p>
        </div>
        <video autoplay playsinline muted id="webcam"></video>
    </div>

    <div class="controls">
        <div id="status-msg">System Awaiting Authorization</div>
        <div class="mode-toggle">
            <div id="btn-train" class="mode-btn active-mode" onclick="setMode('train')">TRAIN</div>
            <div id="btn-test" class="mode-btn" onclick="setMode('test')">TEST</div>
        </div>

        <div id="train-grid">
            <button class="stage-btn" onclick="addSample('1')">1 <span class="count-badge" id="c1">0</span></button>
            <button class="stage-btn" onclick="addSample('1.5')">1.5 <span class="count-badge" id="c1.5">0</span></button>
            <button class="stage-btn" onclick="addSample('2')">2 <span class="count-badge" id="c2">0</span></button>
            <button class="stage-btn" onclick="addSample('2.5')">2.5 <span class="count-badge" id="c2.5">0</span></button>
            <button class="stage-btn" onclick="addSample('3')">3 <span class="count-badge" id="c3">0</span></button>
            <button class="stage-btn" onclick="addSample('3.5')">3.5 <span class="count-badge" id="c3.5">0</span></button>
            <button class="stage-btn" onclick="addSample('4')">4 <span class="count-badge" id="c4">0</span></button>
            <button class="stage-btn" onclick="addSample('4.5')">4.5 <span class="count-badge" id="c4.5">0</span></button>
            <button class="stage-btn" onclick="addSample('5')">5 <span class="count-badge" id="c5">0</span></button>
            <button class="stage-btn" onclick="addSample('5.5')">5.5 <span class="count-badge" id="c5.5">0</span></button>
            <button class="stage-btn" onclick="addSample('6')">6 <span class="count-badge" id="c6">0</span></button>
            <button class="stage-btn" onclick="downloadBackup()" style="background:#222;"><i class="bi bi-download"></i></button>
        </div>

        <div id="test-view">
            <div id="prediction-text" style="font-size: 48px; font-weight: 900; color: var(--accent);">READY</div>
            <div id="confidence-bar" style="font-size: 14px; opacity: 0.7;">Waiting for input...</div>
        </div>

        <div class="action-bar">
            <button class="btn btn-undo" onclick="undoLast()">UNDO LAST</button>
            <button class="btn btn-sync" id="sync-btn" onclick="syncToGithub()">SYNC TO CLOUD</button>
        </div>
    </div>

    <script>
        const GH_TOKEN = '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'; 
        const GH_REPO = 'PulpPro/banana-brain'; 
        const GH_PATH = 'scanner/banana_brain.json';
        
        let classifier, mobilenet;
        const webcamElement = document.getElementById('webcam');
        const counts = {"1":0,"1.5":0,"2":0,"2.5":0,"3":0,"3.5":0,"4":0,"4.5":0,"5":0,"5.5":0,"6":0};
        let lastLabelAdded = null;
        let currentMode = 'train';

        async function startApp() {
            document.getElementById('status-msg').innerText = "Starting...";
            
            // 1. Initialize AI Models
            classifier = knnClassifier.create();
            mobilenet = await mobilenet.load();
            
            // 2. Request Camera with basic constraints (iOS friendly)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' }, 
                    audio: false 
                });
                
                webcamElement.srcObject = stream;
                
                // 3. Force the video to play
                await webcamElement.play();
                
                // 4. UI Swaps
                webcamElement.style.display = 'block';
                document.getElementById('init-overlay').style.display = 'none';
                document.getElementById('status-msg').innerText = "Syncing Cloud...";
                
                await loadFromCloud();
                requestAnimationFrame(predictLoop);
            } catch (err) {
                alert("Camera Blocked. Tap the address bar (AA) and set Camera to 'Allow'.");
                console.error(err);
            }
        }

        async function loadFromCloud() {
            try {
                const res = await fetch(`https://raw.githubusercontent.com/${GH_REPO}/main/${GH_PATH}?t=${Date.now()}`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                const tensorObj = {};
                Object.keys(data).forEach(key => {
                    tensorObj[key] = tf.tensor2d(data[key], [data[key].length / 1024, 1024]);
                    if(counts.hasOwnProperty(key)) {
                        counts[key] = Math.floor(data[key].length / 1024);
                        document.getElementById(`c${key}`).innerText = counts[key];
                    }
                });
                classifier.setClassifierDataset(tensorObj);
                document.getElementById('status-msg').innerText = "Cloud Data Loaded";
            } catch (e) {
                document.getElementById('status-msg').innerText = "Fresh Brain Ready";
            }
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-train').classList.toggle('active-mode', mode === 'train');
            document.getElementById('btn-test').classList.toggle('active-mode', mode === 'test');
            document.getElementById('train-grid').style.display = mode === 'train' ? 'grid' : 'none';
            document.getElementById('test-view').style.display = mode === 'test' ? 'flex' : 'none';
        }

        async function addSample(label) {
            const img = await tf.browser.fromPixels(webcamElement);
            const activation = mobilenet.infer(img, 'conv_preds');
            classifier.addExample(activation, label);
            counts[label]++;
            document.getElementById(`c${label}`).innerText = counts[label];
            lastLabelAdded = label;
            img.dispose();
        }

        function undoLast() {
            if (!lastLabelAdded || counts[lastLabelAdded] === 0) return;
            classifier.clearClass(lastLabelAdded);
            counts[lastLabelAdded] = 0;
            document.getElementById(`c${lastLabelAdded}`).innerText = "0";
            document.getElementById('status-msg').innerText = "Undone locally";
            lastLabelAdded = null;
        }

        async function predictLoop() {
            if (currentMode === 'test' && classifier && classifier.getNumClasses() > 0) {
                const img = await tf.browser.fromPixels(webcamElement);
                const activation = mobilenet.infer(img, 'conv_preds');
                const result = await classifier.predictClass(activation);
                document.getElementById('prediction-text').innerText = result.label;
                document.getElementById('confidence-bar').innerText = `${Math.floor(result.confidences[result.label] * 100)}% Match`;
                img.dispose();
            }
            requestAnimationFrame(predictLoop);
        }

        async function syncToGithub() {
            const btn = document.getElementById('sync-btn');
            btn.innerText = "UPLOADING...";
            let dataset = classifier.getClassifierDataset();
            let datasetObj = {};
            Object.keys(dataset).forEach(key => {
                datasetObj[key] = Array.from(dataset[key].dataSync());
            });
            const content = btoa(JSON.stringify(datasetObj));

            try {
                const getFile = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_PATH}`, {
                    headers: { 'Authorization': `token ${GH_TOKEN}` }
                });
                let sha = null;
                if (getFile.ok) {
                    const fileData = await getFile.json();
                    sha = fileData.sha;
                }
                const response = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_PATH}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${GH_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: "AI Sync", content: content, sha: sha })
                });
                if (response.ok) { alert("Synced to Cloud!"); }
            } catch (err) { alert("Sync failed."); }
            btn.innerText = "SYNC TO CLOUD";
        }

        function downloadBackup() {
            let dataset = classifier.getClassifierDataset();
            let datasetObj = {};
            Object.keys(dataset).forEach(key => {
                datasetObj[key] = Array.from(dataset[key].dataSync());
            });
            let blob = new Blob([JSON.stringify(datasetObj)], {type: "application/json"});
            let a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "backup.json";
            a.click();
        }
    </script>
</body>
</html>
